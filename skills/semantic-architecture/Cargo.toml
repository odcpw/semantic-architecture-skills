[package]
name = "semantic-architecture"
version = "0.1.0"
edition = "2024"
description = "Evidence-bearing semantic architecture compiler above Kerf"
publish = false

[dependencies]
kerf = { path = "../behavioral-factorization" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Evidence runs intentionally hash executables at binding and immediately
# before spawn. Keep those trust checks affordable when the CLI is run from the
# ordinary development profile rather than requiring a release build.
[profile.dev.package.sha2]
opt-level = 3
